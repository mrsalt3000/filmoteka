services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: filmoteka
      POSTGRES_PASSWORD: filmoteka
      POSTGRES_DB: filmoteka
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -U filmoteka
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://filmoteka:filmoteka@db:5432/filmoteka
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me}
      LIBRARY_SPEC_PATH: /app/specs/library.yaml
      # Override LIBRARY_ROOT inside the container: files are always
      # mounted at /media/library regardless of the host path in .env.
      LIBRARY_ROOT: /media/library
      TMDB_API_KEY: ${TMDB_API_KEY}
    volumes:
      - ./specs:/app/specs:ro
      - ${LIBRARY_ROOT:-./media/library}:/media/library
    ports:
      - "8000:8000"
    healthcheck:
      test: python -c "import urllib.request; exit(0) if urllib.request.urlopen('http://localhost:8000/health').status == 200 else exit(1)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://filmoteka:filmoteka@db:5432/filmoteka
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me}
      LIBRARY_SPEC_PATH: /app/specs/library.yaml
      # Override LIBRARY_ROOT inside the container: files are always
      # mounted at /media/library regardless of the host path in .env.
      LIBRARY_ROOT: /media/library
      TMDB_API_KEY: ${TMDB_API_KEY}
    volumes:
      - ./specs:/app/specs:ro
      - ${LIBRARY_ROOT:-./media/library}:/media/library

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
