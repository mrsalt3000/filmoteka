<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filmoteka</title>
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #252525;
  --text: #e0e0e0;
  --text2: #888;
  --accent: #e50914;
  --radius: 8px;
  --play-btn-text: #fff;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f5f5f5;
    --surface: #fff;
    --surface2: #e8e8e8;
    --text: #1a1a1a;
    --text2: #777;
  }
}

.light-theme {
  --bg: #f5f5f5;
  --surface: #fff;
  --surface2: #e8e8e8;
  --text: #1a1a1a;
  --text2: #777;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
nav { display: flex; align-items: center; gap: 1rem; padding: 1rem 2rem; background: var(--surface); position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
nav h1 { font-size: 1.25rem; white-space: nowrap; }
nav input { flex: 1; min-width: 140px; max-width: 400px; padding: .5rem .75rem; border: 1px solid var(--surface2); border-radius: var(--radius); background: var(--surface2); color: var(--text); font-size: .9rem; }
nav input::placeholder { color: var(--text2); }
.nav-btn { background: none; border: 1px solid var(--text2); color: var(--text); border-radius: var(--radius); padding: .35rem .6rem; cursor: pointer; font-size: .9rem; line-height: 1; white-space: nowrap; }
.nav-btn:hover { border-color: var(--text); }
.nav-link { color: var(--text2); cursor: pointer; font-size: .9rem; white-space: nowrap; }
.nav-link:hover { color: var(--text); }
.view-tabs { display: flex; gap: .5rem; margin-bottom: 1rem; }
.view-tab { padding: .4rem 1rem; border: 1px solid var(--surface2); border-radius: var(--radius); cursor: pointer; font-size: .9rem; color: var(--text2); background: var(--surface); user-select: none; }
.view-tab.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.view-tab:hover { border-color: var(--text); }
.page { padding: 1.5rem 2rem; }
.film-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
.film-card { background: var(--surface); border-radius: var(--radius); padding: 1.25rem; cursor: pointer; transition: transform .15s, background .15s; }
.film-card:hover { transform: translateY(-2px); background: var(--surface2); }
.film-card .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: calc(var(--radius) - 2px); background: var(--surface2); display: block; }
.film-card .poster[src=""], .film-card .poster:not([src]) { display: none; }
.film-card .poster-placeholder { width: 100%; aspect-ratio: 2/3; border-radius: calc(var(--radius) - 2px); background: var(--surface2); display: flex; align-items: center; justify-content: center; color: var(--text2); font-size: 2rem; }
.film-card h3 { font-size: 1rem; margin-bottom: .25rem; }
.film-card .year { color: var(--text2); font-size: .85rem; }
.film-card .poster-wrap { position: relative; margin-bottom: .75rem; }
.film-card .watch-badge { position: absolute; bottom: .25rem; left: .25rem; right: .25rem; padding: .35rem .5rem; border-radius: calc(var(--radius) - 2px); font-size: .8rem; font-weight: 600; text-align: center; pointer-events: none; }
.film-card .watch-badge.continue { background: var(--accent); color: var(--play-btn-text); }
.film-card .watch-badge.watched { background: #2e7d32; color: #fff; }
.film-card .progress-track { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: var(--surface2); border-radius: 0 0 calc(var(--radius) - 2px) calc(var(--radius) - 2px); overflow: hidden; }
.film-card .progress-fill { height: 100%; background: var(--accent); transition: width .3s; }

/* ── Continue Watching section ──────────────────── */
.continue-section { margin-bottom: 1.5rem; }
.continue-section h2 { font-size: 1.1rem; margin-bottom: .75rem; color: var(--text); }
.continue-row { display: flex; gap: .75rem; overflow-x: auto; padding-bottom: .5rem; scrollbar-width: thin; }
.continue-card { flex: 0 0 140px; background: var(--surface); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: transform .15s; position: relative; }
.continue-card:hover { transform: translateY(-2px); }
.continue-card .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: var(--surface2); }
.continue-card .poster-placeholder { width: 100%; aspect-ratio: 2/3; background: var(--surface2); display: flex; align-items: center; justify-content: center; color: var(--text2); font-size: 1.5rem; }
.continue-card .info { padding: .5rem .6rem .4rem; }
.continue-card .info h4 { font-size: .8rem; line-height: 1.2; margin-bottom: .25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.continue-card .info .mini-progress { height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; margin-top: .25rem; }
.continue-card .info .mini-progress-fill { height: 100%; background: var(--accent); border-radius: 2px; }
.continue-card .dismiss-btn { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border: none; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: .8rem; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .15s; }
.continue-card:hover .dismiss-btn { opacity: 1; }
.continue-card .dismiss-btn:hover { background: var(--accent); }
.detail { max-width: 720px; }
.detail-layout { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
.detail-poster { flex: 0 0 200px; }
.detail-poster img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: var(--radius); background: var(--surface2); }
.detail-poster .poster-placeholder { width: 100%; aspect-ratio: 2/3; border-radius: var(--radius); background: var(--surface2); display: flex; align-items: center; justify-content: center; color: var(--text2); font-size: 3rem; }
.detail-info { flex: 1; min-width: 0; }
.detail h2 { font-size: 1.5rem; margin-bottom: .5rem; }
.detail .meta { color: var(--text2); margin-bottom: 1rem; }
.detail .external-link { display: inline-block; margin-bottom: .75rem; font-size: .9rem; color: var(--accent); }
.detail .section { margin-bottom: 1.5rem; }
.detail .section h3 { font-size: 1rem; margin-bottom: .5rem; color: var(--accent); }
.detail .section ul { list-style: none; }
.detail .section li { font-size: .9rem; margin-bottom: .25rem; }
.detail .play-btn { display: inline-block; padding: .6rem 1.5rem; background: var(--accent); color: var(--play-btn-text); border: none; border-radius: var(--radius); font-size: 1rem; cursor: pointer; }
.detail .play-btn:hover { opacity: .9; }
.detail .progress-wrap { margin-top: .75rem; }
.detail .progress-track { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.detail .progress-fill { height: 100%; background: var(--accent); transition: width .3s; border-radius: 2px; }
.detail .progress-label { font-size: .8rem; color: var(--text2); margin-top: .25rem; }
.detail .watched-label { display: inline-block; margin-top: .5rem; padding: .25rem .6rem; background: #2e7d32; color: #fff; border-radius: var(--radius); font-size: .85rem; font-weight: 600; }
.player-page video { width: 100%; max-height: 80vh; background: #000; border-radius: var(--radius); }
.player-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text); }
.media-list { list-style: none; padding-left: 0; margin: 0.25rem 0 0 0; font-size: 0.85rem; color: var(--text2); }
.media-list li { padding: 0.1rem 0; }
.back { display: inline-block; margin-bottom: 1rem; color: var(--text2); cursor: pointer; }
.back:hover { color: var(--text); }
.spinner { text-align: center; padding: 3rem; color: var(--text2); }
.error { color: var(--accent); padding: 1rem; }
.empty { color: var(--text2); padding: 2rem; text-align: center; }

/* ── Login form ─────────────────────────────── */
.login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 20; }
.login-box { background: var(--surface); padding: 2rem; border-radius: var(--radius); width: 320px; display: flex; flex-direction: column; gap: .75rem; }
.login-box h2 { font-size: 1.1rem; }
.login-box input { padding: .5rem .75rem; border: 1px solid var(--surface2); border-radius: var(--radius); background: var(--surface2); color: var(--text); font-size: .9rem; }
.login-box button { padding: .5rem; border: none; border-radius: var(--radius); background: var(--accent); color: #fff; font-size: .9rem; cursor: pointer; }
.login-box button:hover { opacity: .9; }
.login-box .login-error { color: var(--accent); font-size: .85rem; }
.login-box .login-cancel { background: none; border: 1px solid var(--text2); color: var(--text); }

/* ── Admin page ─────────────────────────────── */
.admin-page { max-width: 600px; }
.admin-page h2 { margin-bottom: 1rem; }
.admin-page .scan-btn { padding: .75rem 2rem; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-size: 1rem; cursor: pointer; }
.admin-page .scan-btn:hover { opacity: .9; }
.admin-page .scan-btn:disabled { opacity: .5; cursor: not-allowed; }
.admin-page .poster-section { margin-top: 2rem; border-top: 1px solid var(--surface2); padding-top: 1.5rem; }
.admin-page .poster-section h3 { font-size: 1rem; margin-bottom: .75rem; }
.admin-page .poster-section p { font-size: .85rem; color: var(--text2); margin-bottom: .75rem; }
.jobs-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
.jobs-table th, .jobs-table td { padding: .4rem .6rem; text-align: left; border-bottom: 1px solid var(--surface2); }
.jobs-table th { color: var(--text2); font-weight: 600; }
.job-status { padding: .15rem .4rem; border-radius: 3px; font-size: .8rem; font-weight: 500; }
.job-completed { color: #2a6; }
.job-failed, .job-retry { color: #c33; }
.job-running { color: #48b; }
.job-pending { color: var(--text2); }
.admin-page .poster-btns { display: flex; gap: .75rem; flex-wrap: wrap; }
.admin-page .poster-btn { padding: .6rem 1.25rem; background: var(--surface2); color: var(--text); border: 1px solid var(--text2); border-radius: var(--radius); font-size: .9rem; cursor: pointer; }
.admin-page .poster-btn:hover { border-color: var(--text); }
.admin-page .poster-btn:disabled { opacity: .5; cursor: not-allowed; }
.admin-report { margin-top: 1.5rem; background: var(--surface); border-radius: var(--radius); padding: 1.25rem; }
.admin-report h3 { font-size: 1rem; margin-bottom: .75rem; }
.admin-report table { width: 100%; border-collapse: collapse; }
.admin-report td { padding: .35rem .5rem; font-size: .9rem; }
.admin-report td:first-child { color: var(--text2); }
.admin-report .report-errors { margin-top: .75rem; }
.admin-report .report-errors li { color: var(--accent); font-size: .85rem; }

/* ── Transcode progress table ── */
.transcode-progress-wrap { margin-top: 1.5rem; }
.transcode-summary { font-size: .9rem; color: var(--text2); margin-bottom: .75rem; }
.transcode-table-wrap { max-height: 30rem; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); }
.transcode-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
.transcode-table th { position: sticky; top: 0; background: var(--surface); color: var(--text2); padding: .4rem .5rem; text-align: left; font-weight: 600; border-bottom: 1px solid var(--border); }
.transcode-table td { padding: .25rem .5rem; border-bottom: 1px solid var(--border); }
.transcode-table tr:last-child td { border-bottom: none; }
.transcode-table .tx-file { max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-badge { display: inline-block; padding: .1rem .45rem; border-radius: 3px; font-size: .78rem; font-weight: 600; }
.tx-badge.tx-queued { background: #e0e0e0; color: #616161; }
.tx-badge.tx-probing { background: #fff8e1; color: #f57f17; }
.tx-badge.tx-processing { background: #e3f2fd; color: #1565c0; }
.tx-badge.tx-transcoding { background: #e3f2fd; color: #1565c0; }
.tx-badge.tx-completed { background: #e8f5e9; color: #2e7d32; }
.tx-badge.tx-skipped { background: #f5f5f5; color: #9e9e9e; }
.tx-badge.tx-error { background: #ffebee; color: #c62828; }
.tx-error-msg { color: var(--accent); font-size: .8rem; margin-left: .35rem; white-space: normal; word-break: break-word; }
#tx-footer { margin-top: .35rem; font-size: .85rem; color: var(--text2); font-style: italic; }

body.dark .tx-badge.tx-queued { background: #424242; color: #bdbdbd; }
body.dark .tx-badge.tx-probing { background: #3e2723; color: #ffcc80; }
body.dark .tx-badge.tx-transcoding { background: #1a237e; color: #90caf9; }
body.dark .tx-badge.tx-completed { background: #1b5e20; color: #a5d6a7; }
body.dark .tx-badge.tx-skipped { background: #303030; color: #757575; }
body.dark .tx-badge.tx-error { background: #b71c1c; color: #ffcdd2; }

/* ── Player error ────────────────────────────── */
.play-error { text-align: center; padding: 3rem 1rem; }
.play-error .icon { font-size: 3rem; margin-bottom: .5rem; }
.play-error .msg { font-size: 1.1rem; margin-bottom: .25rem; }
.play-error .detail { color: var(--text2); font-size: .85rem; }

/* ── Admin film edit ──────────────────────────── */
.edit-btn { margin-left: .75rem; padding: .25rem .6rem; background: none; border: 1px solid var(--text2); color: var(--text); border-radius: var(--radius); font-size: .8rem; cursor: pointer; }
.edit-btn:hover { border-color: var(--accent); color: var(--accent); }
.edit-field { width: 100%; padding: .35rem .5rem; border: 1px solid var(--surface2); border-radius: var(--radius); background: var(--surface2); color: var(--text); font-size: .9rem; margin-bottom: .5rem; }
.edit-field:focus { border-color: var(--accent); outline: none; }
.edit-textarea { width: 100%; padding: .35rem .5rem; border: 1px solid var(--surface2); border-radius: var(--radius); background: var(--surface2); color: var(--text); font-size: .9rem; resize: vertical; min-height: 60px; margin-bottom: .5rem; }
.edit-textarea:focus { border-color: var(--accent); outline: none; }
.edit-actions { display: flex; gap: .5rem; margin-top: .5rem; }
.edit-save-btn { padding: .4rem 1rem; background: var(--accent); color: var(--play-btn-text); border: none; border-radius: var(--radius); font-size: .85rem; cursor: pointer; }
.edit-save-btn:hover { opacity: .9; }
.edit-cancel-btn { padding: .4rem 1rem; background: none; border: 1px solid var(--text2); color: var(--text); border-radius: var(--radius); font-size: .85rem; cursor: pointer; }
.edit-cancel-btn:hover { border-color: var(--text); }
.network-url { font-size: 1.1rem; font-weight: 600; color: var(--accent); word-break: break-all; }
.network-qr { margin-top: .75rem; text-align: center; }
.network-qr img { width: 160px; height: 160px; border-radius: var(--radius); background: #fff; padding: 8px; }
.network-hint { font-size: .85rem; color: var(--text2); margin-top: .5rem; }
.network-hint code { background: var(--surface2); padding: .15rem .4rem; border-radius: 3px; font-size: .8rem; }
</style>
</head>
<body>
<div id="offline-banner" style="display:none;background:#c33;color:#fff;text-align:center;padding:.5rem;font-size:.85rem">⚠️ Cannot reach server — some features unavailable</div>
<nav id="navbar">
  <h1><a href="#list" onclick="navigate('list')">🎬 Filmoteka</a></h1>
  <input id="search" type="text" placeholder="Search films…" oninput="onSearch(event)">
  <a class="nav-link" id="admin-link" href="#admin" onclick="navigate('admin')" style="display:none">Admin</a>
  <span class="nav-link" id="family-toggle" style="display:none" onclick="toggleFamilyRecs()" title="Toggle family video in recommendations"></span>
  <span class="nav-link" id="watched-toggle" style="display:none" onclick="toggleExcludeWatched()" title="Toggle exclude watched"></span>
  <span class="nav-link" id="external-toggle" style="display:none" onclick="toggleIncludeExternal()" title="Toggle external suggestions"></span>
  <span class="nav-link" id="lang-toggle" style="display:none" onclick="toggleLangFilter()" title="Toggle language filter"></span>
  <span class="nav-link" id="mystats-link" style="display:none" onclick="toggleMyStats()">📊 My Stats</span>
  <span class="nav-link" id="login-btn" onclick="showLogin()">Log in</span>
  <span class="nav-link" id="user-label" style="display:none"></span>
  <span class="nav-link" id="logout-btn" style="display:none" onclick="handleLogout()">Log out</span>
  <button class="nav-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">🌙</button>
</nav>
<div id="mystats-panel" style="display:none;padding:.75rem 2rem;background:var(--surface);border-bottom:1px solid var(--surface2);font-size:.85rem">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
    <strong>My Watch History</strong>
    <span class="nav-link" onclick="toggleMyStats()">Hide ✕</span>
  </div>
  <div id="mystats-content"><div class="spinner">Loading…</div></div>
</div>
<div id="app" class="page"></div>

<script>
// ── Theme ──────────────────────────────────────────────────────────
function getTheme() {
  return localStorage.getItem('filmoteka-theme') ||
    (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
}

function setTheme(theme) {
  document.documentElement.classList.toggle('light-theme', theme === 'light');
  document.getElementById('theme-btn').textContent = theme === 'light' ? '☀️' : '🌙';
  localStorage.setItem('filmoteka-theme', theme);
}

function toggleTheme() {
  setTheme(getTheme() === 'light' ? 'dark' : 'light');
}

setTheme(getTheme());

// ── Auth state ─────────────────────────────────────────────────────
const TOKEN_KEY = 'filmoteka-token';
let currentUser = null;
let editingFilmId = null;
let listMode = 'movies';

function getToken() { return localStorage.getItem(TOKEN_KEY); }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); currentUser = null; }

async function loadUser() {
  const token = getToken();
  if (!token) { currentUser = null; renderNav(); return; }
  try {
    const resp = await fetch('/auth/me', { headers: { Authorization: `Bearer ${token}` } });
    if (!resp.ok) { clearToken(); renderNav(); return; }
    currentUser = await resp.json();
  } catch {
    clearToken();
  }
  renderNav();
}

async function toggleFamilyRecs() {
  const newVal = !currentUser.exclude_family_from_recommendations;
  currentUser = await apiAuth('/me/exclude-family', 'PUT', { exclude: newVal });
  renderNav();
}

async function toggleExcludeWatched() {
  const newVal = !currentUser.exclude_watched;
  currentUser = await apiAuth('/me/exclude-watched', 'PUT', { exclude: newVal });
  renderNav();
}

async function toggleIncludeExternal() {
  const newVal = !currentUser.include_external;
  currentUser = await apiAuth('/me/include-external', 'PUT', { include: newVal });
  renderNav();
}

async function toggleLangFilter() {
  const newVal = !currentUser.filter_by_language;
  currentUser = await apiAuth('/me/filter-by-language', 'PUT', { filter: newVal });
  renderNav();
}

async function toggleMyStats() {
  const panel = document.getElementById('mystats-panel');
  const content = document.getElementById('mystats-content');
  if (panel.style.display !== 'none') {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = 'block';
  content.innerHTML = '<div class="spinner">Loading…</div>';
  try {
    const data = await apiAuth('/me/watch/history?limit=5');
    if (data.total === 0) {
      content.innerHTML = '<p style="color:var(--text2)">No watch history yet.</p>';
      return;
    }
    let html = `<p style="margin-bottom:.5rem;color:var(--text2)">Total: ${data.total} entries</p><table class="jobs-table"><thead><tr><th>Film</th><th>When</th><th>Finished</th></tr></thead><tbody>`;
    data.items.forEach(w => {
      html += `<tr><td>${esc(w.film_title)}</td><td>${new Date(w.started_at).toLocaleString()}</td><td>${w.finished ? '✓' : '…'}</td></tr>`;
    });
    html += '</tbody></table>';
    content.innerHTML = html;
  } catch (e) {
    content.innerHTML = `<div class="error">${esc(e.message)}</div>`;
  }
}

function renderNav() {
  const loginBtn = document.getElementById('login-btn');
  const userLabel = document.getElementById('user-label');
  const logoutBtn = document.getElementById('logout-btn');
  const adminLink = document.getElementById('admin-link');
  const familyToggle = document.getElementById('family-toggle');
  const myStatsLink = document.getElementById('mystats-link');
  const watchedToggle = document.getElementById('watched-toggle');
  const externalToggle = document.getElementById('external-toggle');
  const langToggle = document.getElementById('lang-toggle');

  if (currentUser) {
    loginBtn.style.display = 'none';
    userLabel.style.display = 'inline';
    userLabel.textContent = currentUser.username;
    logoutBtn.style.display = 'inline';
    adminLink.style.display = currentUser.role === 'admin' ? 'inline' : 'none';
    familyToggle.style.display = 'inline';
    familyToggle.textContent = currentUser.exclude_family_from_recommendations
      ? '👪 Recs: OFF'
      : '👪 Recs: ON';
    myStatsLink.style.display = 'inline';
    watchedToggle.style.display = 'inline';
    watchedToggle.textContent = currentUser.exclude_watched
      ? '👁 Watched: OFF'
      : '👁 Watched: ON';
    externalToggle.style.display = 'inline';
    externalToggle.textContent = currentUser.include_external
      ? '🌐 External: ON'
      : '🌐 External: OFF';
    langToggle.style.display = 'inline';
    langToggle.textContent = currentUser.filter_by_language
      ? '🔊 Lang: ON'
      : '🔊 Lang: OFF';
  } else {
    loginBtn.style.display = 'inline';
    userLabel.style.display = 'none';
    logoutBtn.style.display = 'none';
    adminLink.style.display = 'none';
    familyToggle.style.display = 'none';
    myStatsLink.style.display = 'none';
    watchedToggle.style.display = 'none';
    externalToggle.style.display = 'none';
    langToggle.style.display = 'none';
    document.getElementById('mystats-panel').style.display = 'none';
  }
}

// ── Login ──────────────────────────────────────────────────────────
function showLogin() {
  const overlay = document.createElement('div');
  overlay.className = 'login-overlay';
  overlay.id = 'login-overlay';
  overlay.innerHTML = `
    <div class="login-box">
      <h2>Log in</h2>
      <input id="login-username" type="text" placeholder="Username" autocomplete="username">
      <input id="login-password" type="password" placeholder="Password" autocomplete="current-password">
      <div class="login-error" id="login-error"></div>
      <button onclick="handleLogin()">Log in</button>
      <button class="login-cancel" onclick="closeLogin()">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('login-username').focus();

  overlay.addEventListener('keydown', function onKey(e) {
    if (e.key === 'Escape') closeLogin();
    if (e.key === 'Enter') handleLogin();
  });
}

function closeLogin() {
  const el = document.getElementById('login-overlay');
  if (el) el.remove();
}

async function handleLogin() {
  const username = document.getElementById('login-username').value;
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('login-error');
  errorEl.textContent = '';
  try {
    const resp = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!resp.ok) throw new Error('Invalid username or password');
    const data = await resp.json();
    setToken(data.access_token);
    closeLogin();
    await loadUser();
    render();
  } catch (e) {
    errorEl.textContent = e.message;
  }
}

async function handleLogout() {
  clearToken();
  renderNav();
  if (currentRoute().view === 'admin') navigate('list');
  else render();
}

// ── Router ─────────────────────────────────────────────────────────
function navigate(hash) {
  location.hash = `#${hash}`;
}

function currentRoute() {
  const h = location.hash.slice(1) || 'list';
  const parts = h.split('/');
  return { view: parts[0], id: parts[1], mediaId: parts[2] };
}

// ── Data fetching ───────────────────────────────────────────────────
async function api(path) {
  const resp = await fetch(path);
  if (!resp.ok) {
    document.getElementById('offline-banner').style.display = 'block';
    throw new Error(`${resp.status} ${resp.statusText}`);
  }
  document.getElementById('offline-banner').style.display = 'none';
  return resp.json();
}

async function apiAuth(path, method, body) {
  const token = getToken();
  const opts = { method: method || 'GET', headers: { Authorization: `Bearer ${token}` } };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const resp = await fetch(path, opts);
  if (!resp.ok) {
    document.getElementById('offline-banner').style.display = 'block';
    throw new Error(`${resp.status} ${resp.statusText}`);
  }
  document.getElementById('offline-banner').style.display = 'none';
  return resp.json();
}

// ── Render logic ────────────────────────────────────────────────────
async function render() {
  const el = document.getElementById('app');
  const route = currentRoute();
  try {
    if (route.view === 'film' && route.id) {
      await renderFilm(el, route.id);
    } else if (route.view === 'play' && route.id) {
      await renderPlayer(el, route.id);
    } else if (route.view === 'admin') {
      await renderAdmin(el);
    } else {
      await renderList(el);
    }
  } catch (e) {
    el.innerHTML = `<div class="error">Error: ${e.message}</div>`;
  }
}

function _tabsHtml() {
  return `
    <div class="view-tabs">
      <span class="view-tab ${listMode === 'movies' ? 'active' : ''}" onclick="switchListMode('movies')">Movies</span>
      <span class="view-tab ${listMode === 'family' ? 'active' : ''}" onclick="switchListMode('family')">Family</span>
    </div>`;
}

async function renderList(el) {
  const q = document.getElementById('search').value;
  const params = new URLSearchParams({ limit: '50' });
  if (q) params.set('q', q);
  if (listMode === 'family') params.set('include_family', 'true');
  const data = await api(`/films?${params}`);
  if (data.items.length === 0) {
    const emptyMsg = listMode === 'family'
      ? 'No family videos found.'
      : (q ? 'No films match your search.' : 'Library is empty.');
    el.innerHTML = _tabsHtml() + `<div class="empty">${emptyMsg}</div>`;
    return;
  }

  // Batch-fetch watch states if logged in
  let watchStates = {};
  if (currentUser) {
    const filmIds = data.items.map(f => f.id);
    try {
      const resp = await apiAuth('/media/watch/states-by-film', 'POST', { film_ids: filmIds });
      watchStates = resp.states || {};
    } catch { /* show grid without watch states */ }
  }

  // Fetch continue-watching section if search is empty and logged in
  let continueHtml = '';
  if (!q && currentUser) {
    continueHtml = await _fetchContinueWatching();
  }

  el.innerHTML = _tabsHtml() + continueHtml + `<div class="film-grid">${data.items.map(f => {
    const st = watchStates[f.id];
    let badgeHtml = '';
    let progressHtml = '';
    if (st && st.has_state) {
      if (st.finished) {
        badgeHtml = `<div class="watch-badge watched">✓ Watched</div>`;
      } else if (st.last_position > 0 && st.duration_secs > 0) {
        const pct = Math.min(100, Math.round((st.last_position / st.duration_secs) * 100));
        progressHtml = `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>`;
        badgeHtml = `<div class="watch-badge continue">▶ Continue</div>`;
      }
    }
    return `
    <div class="film-card" onclick="navigate('film/${f.id}')">
      <div class="poster-wrap">
        ${f.poster_url
          ? `<img class="poster" src="${esc(f.poster_url)}" alt="" loading="lazy" onerror="this.style.display='none'">`
          : `<div class="poster-placeholder">🎬</div>`}
        ${badgeHtml}
        ${progressHtml}
      </div>
      <h3>${esc(f.title)}</h3>
      <div class="year">${f.year || '—'}</div>
    </div>`;
  }).join('')}</div>`;
}

function switchListMode(mode) {
  listMode = mode;
  render();
}

async function renderFilm(el, id) {
  const f = await api(`/films/${id}`);
  const genres = f.genres.map(g => esc(g.name)).join(', ') || '—';
  const persons = f.persons.map(p => `${esc(p.name)} (${esc(p.role)})`).join(', ') || '—';
  const firstMedia = f.editions[0]?.media_files?.[0];

  // Store media aliases for the player page
  window._mediaAliases = window._mediaAliases || {};
  f.editions.forEach(e => {
    (e.media_files || []).forEach(m => {
      window._mediaAliases[m.id] = m.media_alias || m.file_path.split(/[\\/]/).pop().replace(/\.[^/.]+$/, '');
    });
  });

  // Check for resume state if logged in
  let watchState = null;
  if (currentUser && firstMedia) {
    try {
      watchState = await apiAuth(`/media/${firstMedia.id}/watch/state`);
    } catch { /* ignore — show Play button */ }
  }

  let playBtnHtml = '';
  if (firstMedia) {
    if (watchState && watchState.has_state && watchState.last_position > 0) {
      const pos = formatTime(watchState.last_position);
      playBtnHtml = `<button class="play-btn" onclick="navigate('play/${firstMedia.id}')">▶ Continue (${pos})</button>`;
    } else {
      playBtnHtml = `<button class="play-btn" onclick="navigate('play/${firstMedia.id}')">▶ Play</button>`;
    }
  }

  // Build progress bar or watched label below the play button
  let progressHtml = '';
  let watchedHtml = '';
  if (watchState && watchState.has_state) {
    if (watchState.finished) {
      watchedHtml = `<div class="watched-label">✓ Watched</div>`;
    } else if (watchState.last_position > 0 && firstMedia && firstMedia.duration_secs > 0) {
      const pct = Math.min(100, Math.round((watchState.last_position / firstMedia.duration_secs) * 100));
      const pos = formatTime(watchState.last_position);
      const total = formatTime(firstMedia.duration_secs);
      progressHtml = `<div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label">${pos} / ${total}</div>
      </div>`;
    }
  }

  el.innerHTML = `
    <div class="back" onclick="navigate('list')">← Back to list</div>
    <div class="detail">
      <div class="detail-layout">
        <div class="detail-poster">
          ${f.poster_url
            ? `<img src="${esc(f.poster_url)}" alt="${esc(f.title)}" onerror="this.style.display='none'">`
            : `<div class="poster-placeholder">🎬</div>`}
        </div>
        <div class="detail-info">
          ${editingFilmId === f.id ? `
            <input class="edit-field" id="edit-title" type="text" value="${esc(f.title)}" placeholder="Title">
            <input class="edit-field" id="edit-year" type="number" value="${f.year || ''}" placeholder="Year">
            <textarea class="edit-textarea" id="edit-description" placeholder="Description">${esc(f.description || '')}</textarea>
            <input class="edit-field" id="edit-poster-url" type="text" value="${esc(f.poster_url || '')}" placeholder="Poster URL (optional)">
            <div class="edit-actions">
              <button class="edit-save-btn" onclick="saveFilmEdit(${f.id})">Save</button>
              <button class="edit-cancel-btn" onclick="cancelFilmEdit()">Cancel</button>
            </div>
          ` : `
            <h2>${esc(f.title)}
              ${currentUser && currentUser.role === 'admin' ? `<button class="edit-btn" onclick="startFilmEdit(${f.id})">✏ Edit</button>` : ''}
            </h2>
            <div class="meta">${f.year || '—'}${f.description ? ' · ' + esc(f.description) : ''}</div>
          `}
          ${playBtnHtml}
          ${progressHtml}
          ${watchedHtml}
        </div>
      </div>
      <div class="section">
        <h3>Genres</h3><p>${genres}</p>
      </div>
      <div class="section">
        <h3>Cast & Crew</h3><p>${persons}</p>
      </div>
      <div class="section">
        <h3>Editions</h3>
        <ul>${f.editions.map(e => `
          <li>${esc(e.edition_name || e.quality || 'Edition')}
            <ul class="media-list">${e.media_files.map(m => {
              const alias = m.media_alias || m.file_path.split(/[\\\\/]/).pop().replace(/\.[^/.]+$/, '');
              const codec = m.codec ? ` (${esc(m.codec)})` : '';
              return `<li>${esc(alias)}${codec}</li>`;
            }).join('')}</ul>
          </li>
        `).join('')}</ul>
      </div>
    </div>`;
}

async function saveFilmEdit(id) {
  const title = document.getElementById('edit-title').value.trim();
  const year = document.getElementById('edit-year').value.trim();
  const description = document.getElementById('edit-description').value.trim();
  const posterUrl = document.getElementById('edit-poster-url').value.trim();
  const body = {};
  if (title) body.title = title;
  if (year) body.year = parseInt(year, 10);
  if (description) body.description = description;
  if (posterUrl) body.poster_url = posterUrl;
  try {
    await apiAuth(`/admin/films/${id}`, 'PUT', body);
    editingFilmId = null;
    render();
  } catch (e) {
    alert('Failed to save: ' + e.message);
  }
}

async function renderPlayer(el, mediaId) {
  const src = `/media/${mediaId}/stream`;

  // Check stream availability before showing the video element
  let status = 200;
  let statusText = '';
  let watchInfo = null;
  try {
    const resp = await fetch(src, { method: 'HEAD', cache: 'no-cache' });
    status = resp.status;
    statusText = resp.statusText;
  } catch {
    el.innerHTML = `
      <div class="back" onclick="navigate('list')">← Back to list</div>
      <div class="play-error">
        <div class="icon">⚠️</div>
        <div class="msg">Could not load video</div>
        <div class="detail">Check that the server is running and try again.</div>
      </div>`;
    return;
  }

  if (status === 404) {
    el.innerHTML = `
      <div class="back" onclick="navigate('list')">← Back to list</div>
      <div class="play-error">
        <div class="icon">🔍</div>
        <div class="msg">Video file not found</div>
        <div class="detail">The media file may have been moved or deleted.</div>
      </div>`;
    return;
  }

  if (status === 401 || status === 403) {
    el.innerHTML = `
      <div class="back" onclick="navigate('list')">← Back to list</div>
      <div class="play-error">
        <div class="icon">🔒</div>
        <div class="msg">Access denied</div>
        <div class="detail">Please log in and try again.</div>
      </div>`;
    return;
  }

  if (status === 415) {
    el.innerHTML = `
      <div class="back" onclick="navigate('list')">← Back to list</div>
      <div class="play-error">
        <div class="icon">🎬</div>
        <div class="msg">MKV format not supported</div>
        <div class="detail">MKV files require ffmpeg on the server for playback. Try downloading the file instead.</div>
      </div>`;
    return;
  }

  if (status >= 500) {
    el.innerHTML = `
      <div class="back" onclick="navigate('list')">← Back to list</div>
      <div class="play-error">
        <div class="icon">⚠️</div>
        <div class="msg">Server error</div>
        <div class="detail">${esc(status)} ${esc(statusText)}</div>
      </div>`;
    return;
  }

  // Status OK — start watch and render the video player
  let startPosition = 0;
  let watchEventId = null;
  if (currentUser) {
    try {
      const ws = await apiAuth(`/media/${mediaId}/watch/start`, 'POST');
      watchEventId = ws.watch_event_id;
      if (ws.last_position > 0) startPosition = ws.last_position;
    } catch { /* play without watch tracking */ }
  }

  el.innerHTML = `
    <div class="back" onclick="navigate('list')">← Back to list</div>
    <div class="player-page">
      <div class="player-title">${
        window._mediaAliases && window._mediaAliases[mediaId]
          ? esc(window._mediaAliases[mediaId])
          : `Media #${mediaId}`
      }</div>
      <video id="player-video" controls autoplay preload="metadata">
        <source src="${src}">
        Your browser does not support video playback.
      </video>
      <div id="player-error" class="play-error" style="display:none">
        <div class="icon">🎬</div>
        <div class="msg">Cannot play this video</div>
        <div class="detail">The format may not be supported by your browser. Try downloading the file instead.</div>
      </div>
    </div>`;

  const video = document.getElementById('player-video');
  if (video) {
    // Seek to resume position once metadata is loaded
    if (startPosition > 0) {
      video.addEventListener('loadedmetadata', function onMeta() {
        video.currentTime = startPosition;
        video.removeEventListener('loadedmetadata', onMeta);
      }, { once: true });
    }

    // Save progress periodically
    if (watchEventId) {
      let progressInterval = setInterval(() => {
        apiAuth(`/media/${mediaId}/watch/${watchEventId}/progress`, 'PATCH', { position: video.currentTime });
      }, 10000);

      // Save on navigation away
      window.addEventListener('hashchange', function onHash() {
        apiAuth(`/media/${mediaId}/watch/${watchEventId}/progress`, 'PATCH', { position: video.currentTime });
        clearInterval(progressInterval);
        window.removeEventListener('hashchange', onHash);
      }, { once: true });
    }

    // Error fallback
    video.addEventListener('error', function () {
      const errorEl = document.getElementById('player-error');
      if (errorEl) {
        video.style.display = 'none';
        errorEl.style.display = 'block';
      }
    });
  }
}

async function loadExtStatus() {
  const el = document.getElementById('ext-status');
  if (!el) return;
  try {
    const h = await api('/health');
    const dbIcon = h.database.status === 'ok' ? '✅' : '❌';
    const redisIcon = h.redis.status === 'ok' ? '✅' : '❌';
    const extIcon = h.external.status === 'ok' ? '✅' : h.external.status === 'degraded' ? '⚠️' : '❌';
    el.innerHTML = `
      <table class="jobs-table">
        <tr><td>Database</td><td>${dbIcon} ${h.database.status}</td></tr>
        <tr><td>Redis</td><td>${redisIcon} ${h.redis.status}</td></tr>
        <tr><td>OMDB API</td><td>${extIcon} ${h.external.status}</td></tr>
      </table>
      <p style="margin-top:.5rem;font-size:.8rem;color:var(--text2)">Version: ${h.version}</p>`;
  } catch {
    el.innerHTML = '<div class="error">Could not reach health endpoint.</div>';
  }
}

function renderNetworkAccess() {
  const el = document.getElementById('network-access');
  if (!el) return;
  const host = window.location.hostname;
  const proto = window.location.protocol;
  const port = window.location.port;
  const baseUrl = proto + '//' + host + (port ? ':' + port : '');
  const isLocal = host === 'localhost' || host === '127.0.0.1' || host === '::1';
  if (isLocal) {
    el.innerHTML = `
      <div class="network-hint">
        💡 To access from another device, find your computer's LAN IP first:
      </div>
      <div class="network-hint">
        1. Open <strong>Command Prompt</strong> on this computer<br>
        2. Run: <code>ipconfig</code><br>
        3. Find <strong>IPv4 Address</strong> (e.g. <code>192.168.1.100</code>)<br>
        4. On the other device, open: <code>http://<em>&lt;that-IP&gt;</em>/</code>
      </div>
      <div class="network-hint" style="margin-top:.75rem">
        🔒 Ensure Windows Firewall allows inbound port 80 on Private networks.
      </div>`;
  } else {
    const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(baseUrl + '/');
    el.innerHTML = `
      <div class="network-url">🔗 <a href="${baseUrl}/" target="_blank">${baseUrl}/</a></div>
      <div class="network-qr"><img src="${qrUrl}" alt="QR Code" loading="lazy"></div>
      <div class="network-hint">Scan the QR code or open the URL on another device connected to the same WiFi network.</div>`;
  }
}

async function loadConflicts() {

  try {
    const data = await apiAuth('/admin/conflicts');
    if (data.items.length === 0) {
      el.innerHTML = '<p style="color:var(--text2)">No conflicts.</p>';
      return;
    }
    let html = '<table class="jobs-table"><thead><tr><th>Film</th><th>Year</th><th>Files</th><th></th></tr></thead><tbody>';
    data.items.forEach(f => {
      const fileCount = f.editions.reduce((s, e) => s + e.media_files.length, 0);
      html += `<tr>
        <td>${esc(f.title)}</td>

async function runAliasOp(mode, btnLabel) {
  const btn = document.getElementById(mode === 'generate-all' ? 'alias-all-btn' : 'alias-btn');
  const reportEl = document.getElementById('alias-report');
  if (!btn || !reportEl) return;

  const label = mode === 'generate-all' ? 'Generate all aliases' : 'Generate aliases (defaults only)';
  const endpoint = mode === 'generate-all' ? '/admin/aliases/generate-all' : '/admin/aliases/generate';
  if (!confirm(`Start "${label}"? This will query DeepSeek for each media file.`)) return;

  btn.disabled = true;
  btn.textContent = '⏳ Starting…';
  reportEl.innerHTML = '<div class="spinner">Starting…</div>';

  try {
    const startResp = await apiAuth(endpoint, 'POST');
    if (startResp.status === 'error') {
      reportEl.innerHTML = `<div class="error">${esc(startResp.error || 'Unknown error')}</div>`;
      return;
    }

    const jobId = startResp.job_id;
    if (!jobId) throw new Error('No job_id returned');

    const MAX_DISPLAY = 50;
    let jobCompleted = false;

    // Build the progress table shell
    reportEl.innerHTML = `
      <div class="transcode-progress-wrap">
        <h3>${esc(label)} — Progress</h3>
        <div class="transcode-summary" id="al-summary">Initialising…</div>
        <div class="transcode-table-wrap">
          <table class="transcode-table">
            <thead><tr><th>#</th><th>File</th><th>Status</th></tr></thead>
            <tbody id="al-tbody"></tbody>
          </table>
        </div>
        <div id="al-footer"></div>
      </div>`;

    const tbody = document.getElementById('al-tbody');
    const summaryEl = document.getElementById('al-summary');
    const footerEl = document.getElementById('al-footer');

    // Poll loop: fetch progress + job status every 2s
    for (let i = 0; i < 600; i++) {
      await new Promise(r => setTimeout(r, 2000));

      // Fetch per-file progress
      let entries = [];
      try {
        const pr = await apiAuth(`/admin/alias-progress/${jobId}`);
        entries = pr.entries || [];
      } catch { /* keep old entries */ }

      // Update table
      if (entries.length > 0) {
        const counts = { queued: 0, processing: 0, completed: 0, error: 0 };
        entries.forEach(e => { if (counts[e.status] !== undefined) counts[e.status]++; });

        summaryEl.textContent = `${entries.length} files — ` +
          `${counts.completed} completed, ${counts.processing} processing, ${counts.queued} queued, ${counts.error} errors`;

        const display = entries.slice(0, MAX_DISPLAY);
        tbody.innerHTML = display.map((e, i) => {
          const statusClass = 'tx-' + e.status;
          const label = e.status.charAt(0).toUpperCase() + e.status.slice(1);
          const errorHint = e.error ? ` title="${esc(e.error)}"` : '';
          return `<tr${errorHint}>
            <td>${i + 1}</td>
            <td class="tx-file">${esc(e.file_name)}</td>
            <td><span class="tx-badge ${statusClass}">${label}</span></td>
          </tr>`;
        }).join('');
        if (entries.length > MAX_DISPLAY) {
          footerEl.textContent = `… and ${entries.length - MAX_DISPLAY} more file(s)`;
        } else {
          footerEl.textContent = '';
        }
      }

      // Check job status
      if (jobCompleted) break;
      try {
        const job = await apiAuth(`/admin/jobs/${jobId}`);
        if (job.status === 'completed' || job.status === 'failed') {
          jobCompleted = true;
          const r = job.result;
          if (job.status === 'completed') {
            const errors = (r && r.errors) || [];
            reportEl.innerHTML += `<div class="admin-report" style="margin-top:1rem">
              <h3>${esc(label)} — Complete</h3>
              <table>
                <tr><td>Total media files</td><td>${r ? r.total : '?'}</td></tr>
                <tr><td>Updated</td><td>${r ? r.updated : '?'}</td></tr>
                <tr><td>Skipped</td><td>${r ? r.skipped : '?'}</td></tr>
              </table>
              ${errors.length > 0 ? `
                <div class="report-errors">
                  <strong>Errors (${errors.length})</strong>
                  <ul>${errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul>
                </div>` : ''}
            </div>`;
          } else {
            reportEl.innerHTML += `<div class="error" style="margin-top:1rem">${esc(label)} failed: ${esc(job.error || 'Unknown error')}</div>`;
          }
          break;
        }
      } catch { /* keep polling */ }
    }

    if (!jobCompleted) throw new Error('Job timed out after 20 minutes');

  } catch (e) {
    const existing = reportEl.querySelector('.admin-report, .error');
    if (!existing) reportEl.innerHTML = `<div class="error">${esc(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = btnLabel;
  }
}

      if (entries.length > 0) {

        entries.forEach(e => { if (counts[e.status] !== undefined) counts[e.status]++; });

                <tr><td>Skipped (no AC3)</td><td>${r ? r.skipped : '?'}</td></tr>
                <tr><td>Errors</td><td>${r ? r.error_count : '?'}</td></tr>
              </table>
              ${errors.length > 0 ? `
                <div class="report-errors">
                  <strong>Errors (${errors.length})</strong>
                  <ul>${errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul>
                </div>` : '<p style="color:var(--text2);margin-top:.5rem">✅ All done — no errors.</p>'}
            </div>`;
          } else {
            reportEl.innerHTML += `<div class="error" style="margin-top:1rem">Transcoding failed: ${esc(job.error || 'Unknown error')}</div>`;
          }
          break;
        }
      } catch { /* keep polling */ }
    }

    if (!jobCompleted) throw new Error('Job timed out after 20 minutes');

  } catch (e) {
    const existing = reportEl.querySelector('.admin-report, .error');
    if (!existing) reportEl.innerHTML = `<div class="error">Transcoding failed: ${esc(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '🎵 Transcode AC3 audio';
  }
}

// ── Continue Watching ───────────────────────────────────────────────
async function _fetchContinueWatching() {
  try {
    const resp = await api('/media/watch/continue');
    if (!resp || !resp.items || resp.items.length === 0) return '';
    const dismissed = _getDismissedContinue();
    const items = resp.items.filter(i => !dismissed.has(i.film_id));
    if (items.length === 0) return '';
    return `<div class="continue-section">
      <h2>▶ Continue Watching</h2>
      <div class="continue-row">${items.map(i => {
        const pct = i.duration_secs > 0 ? Math.min(100, Math.round((i.last_position / i.duration_secs) * 100)) : 0;
        const poster = i.poster_url
          ? `<img class="poster" src="${esc(i.poster_url)}" alt="" loading="lazy" onerror="this.style.display='none'">`
          : `<div class="poster-placeholder">🎬</div>`;
        return `<div class="continue-card" onclick="navigate('film/${i.film_id}')">
          ${poster}
          <button class="dismiss-btn" onclick="event.stopPropagation();_dismissContinue(${i.film_id})" title="Dismiss">✕</button>
          <div class="info">
            <h4>${esc(i.title)}</h4>
            <div class="mini-progress"><div class="mini-progress-fill" style="width:${pct}%"></div></div>
          </div>
        </div>`;
      }).join('')}</div>
    </div>`;
  } catch {
    return '';
  }
}

function _getDismissedContinue() {
  try {
    return new Set(JSON.parse(localStorage.getItem('dismissedContinue') || '[]'));
  } catch {
    return new Set();
  }
}

function _dismissContinue(filmId) {
  const dismissed = _getDismissedContinue();
  dismissed.add(filmId);
  localStorage.setItem('dismissedContinue', JSON.stringify([...dismissed]));
  // Re-render the continue section without touching the film grid
  const section = document.querySelector('.continue-section');
  if (section) {
    const parent = section.parentElement;
    _fetchContinueWatching().then(html => {
      if (html) {
        section.outerHTML = html;
      } else {
        section.remove();
      }
    });
  }
}

// ── Search ──────────────────────────────────────────────────────────
function onSearch(e) {
  if (currentRoute().view === 'list') render();
}

// ── Helpers ─────────────────────────────────────────────────────────
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

function formatTime(secs) {
  if (secs == null || secs < 0) return '0:00';
  const total = Math.floor(secs);
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// ── Init ────────────────────────────────────────────────────────────
window.addEventListener('hashchange', render);
loadUser().then(() => render());
</script>
