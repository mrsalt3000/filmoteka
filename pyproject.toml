[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "filmoteka"
version = "0.1.0"
description = "Home video hosting for a local movie archive"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "bcrypt>=4.1",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.15",
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["filmoteka*"]

[tool.setuptools.package-data]
filmoteka = ["py.typed", "static/*"]

[project.scripts]
filmoteka = "filmoteka.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require a running PostgreSQL container",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "silent"
ignore_missing_imports = true
exclude = ["migrations/", ".*conftest\\.py"]
